name: Publish backend benchmark comment

on:
  workflow_run:
    workflows: [Backend benchmarks]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: backend-benchmark-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This privileged job executes only the default branch's publishing code.
      # The PR artifact is parsed as data; no PR scripts/binaries are run here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: backend-benchmark-report
          path: benchmark-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Update the PR benchmark comment
        uses: actions/github-script@v9
        with:
          script: |
            const publish = require('./.github/scripts/publish-backend-benchmark.cjs');
            await publish({ github, context, core });
